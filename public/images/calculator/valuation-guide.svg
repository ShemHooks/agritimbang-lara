<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Livestock valuation guide</title><desc id="d">Weight and official price combine to estimate livestock value.</desc><rect width="900" height="300" rx="22" fill="#f2f8f3"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="65" y="70" width="210" height="150" rx="18" fill="#fff" stroke="#b9d8c1" stroke-width="4"/><text x="170" y="125" font-size="26" font-weight="700" fill="#276d45">Live weight</text><text x="170" y="170" font-size="34" font-weight="700" fill="#1e5437">kg</text><text x="170" y="198" font-size="16" fill="#617469">Estimated / actual</text><text x="330" y="160" font-size="48" font-weight="700" fill="#16845b">×</text><rect x="385" y="70" width="210" height="150" rx="18" fill="#fff" stroke="#b9d8c1" stroke-width="4"/><text x="490" y="125" font-size="26" font-weight="700" fill="#276d45">Official price</text><text x="490" y="170" font-size="34" font-weight="700" fill="#1e5437">₱ / kg</text><text x="490" y="198" font-size="16" fill="#617469">MAO reference</text><text x="650" y="160" font-size="48" font-weight="700" fill="#16845b">=</text><rect x="700" y="70" width="150" height="150" rx="18" fill="#e1f2e5" stroke="#16845b" stroke-width="4"/><text x="775" y="125" font-size="22" font-weight="700" fill="#276d45">Estimated</text><text x="775" y="155" font-size="22" font-weight="700" fill="#276d45">value</text><text x="775" y="190" font-size="25" font-weight="700" fill="#1e5437">₱</text></g></svg>
